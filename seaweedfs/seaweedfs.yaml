apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: bigdata
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: admin
      port: 23646
      targetPort: 23646
    # Internal component discovery for the single-process mini deployment.
    - name: master
      port: 9333
      targetPort: 9333
    - name: master-grpc
      port: 19333
      targetPort: 19333
    - name: volume
      port: 9340
      targetPort: 9340
    - name: volume-grpc
      port: 19340
      targetPort: 19340
    - name: filer
      port: 8888
      targetPort: 8888
    - name: filer-grpc
      port: 18888
      targetPort: 18888
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: bigdata
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: bigdata
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: seaweedfs
          # Existing supplied image resolved to SeaweedFS 4.47, not floating latest.
          image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          args:
            - mini
            - -dir=/data
            - -ip=seaweedfs
            - -ip.bind=0.0.0.0
            - -master.telemetry=false
            - -bucket=warehouse
            - -admin.user=$(AWS_ACCESS_KEY_ID)
            - -admin.password=$(AWS_SECRET_ACCESS_KEY)
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: s3-secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8333
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
