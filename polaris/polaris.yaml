apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: bigdata
spec:
  selector:
    app: polaris
  ports:
    - name: api
      port: 8181
      targetPort: 8181
    - name: management
      port: 8182
      targetPort: 8182
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
    spec:
      # Cluster restart starts all pods together. Wait for DNS and authenticated SQL.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          command: [sh, -c]
          args:
            - >-
              until PGPASSWORD="$DB_PASSWORD" psql -h postgres -U "$DB_USER"
              -d polaris -Atqc 'SELECT 1' >/dev/null 2>&1;
              do echo 'Waiting for PostgreSQL and cluster DNS'; sleep 3; done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: polaris
          image: apache/polaris:1.7.0
          ports:
            - containerPort: 8181
            - containerPort: 8182
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE
              value: postgresql
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres:5432/polaris
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-user
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-password
            - name: POLARIS_REALM_CONTEXT_REALMS
              value: POLARIS
            - name: JAVA_TOOL_OPTIONS
              # Explicit education-only override required by Polaris 1.7.0.
              value: '-Dpolaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true -Dpolaris.readiness.ignore-severe-issues=true'
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: s3-secret-key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8182
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
