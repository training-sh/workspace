apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: bigdata
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.7.0
          args: [bootstrap, -r, POLARIS, -c, "$(BOOTSTRAP_CREDENTIALS)"]
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE
              value: postgresql
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres:5432/polaris
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-user
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: database-password
            - name: BOOTSTRAP_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: lab-credentials
                  key: polaris-bootstrap-credentials
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
