apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: bigdata
data:
  loki.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  path_prefix:\
    \ /loki\n  replication_factor: 1\n  ring:\n    instance_addr: 127.0.0.1\n    kvstore:\n\
    \      store: inmemory\n  storage:\n    filesystem:\n      chunks_directory: /loki/chunks\n\
    \      rules_directory: /loki/rules\nschema_config:\n  configs:\n    - from: 2024-01-01\n\
    \      store: tsdb\n      object_store: filesystem\n      schema: v13\n      index:\n\
    \        prefix: index_\n        period: 24h\nstorage_config:\n  tsdb_shipper:\n\
    \    active_index_directory: /loki/index\n    cache_location: /loki/index-cache\n\
    compactor:\n  working_directory: /loki/compactor\n  compaction_interval: 10m\n\
    \  retention_enabled: true\n  retention_delete_delay: 2h\n  delete_request_store:\
    \ filesystem\nlimits_config:\n  retention_period: 72h\n  ingestion_rate_mb: 2\n\
    \  ingestion_burst_size_mb: 4\n  max_query_parallelism: 2\n  reject_old_samples_max_age:\
    \ 72h\nquerier:\n  max_concurrent: 2\nchunk_store_config:\n  chunk_cache_config:\n\
    \    embedded_cache:\n      enabled: true\n      max_size_mb: 32\nquery_range:\n\
    \  cache_results: false\nanalytics:\n  reporting_enabled: false\n"
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: bigdata
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: bigdata
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: loki
        image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
        args:
        - -config.file=/etc/loki/loki.yaml
        env:
        - name: GOMEMLIMIT
          value: 384MiB
        ports:
        - containerPort: 3100
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /loki
        - name: config
          mountPath: /etc/loki
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /ready
            port: 3100
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
