# Metrics source for template 7589: topics, offsets and consumer-group lag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
        args:
        - --kafka.server=kafka:9092
        - --kafka.version=3.9.0
        - --offset.show-all
        - --refresh.metadata=15s
        ports:
        - name: metrics
          containerPort: 9308
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: bigdata
spec:
  selector:
    app: kafka-exporter
  ports:
  - name: metrics
    port: 9308
    targetPort: metrics
