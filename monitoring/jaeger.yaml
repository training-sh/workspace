apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: bigdata
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
    extensions:
      jaeger_query:
        http:
          endpoint: 0.0.0.0:16686
        storage:
          traces: training
      jaeger_storage:
        backends:
          training:
            badger:
              directories:
                keys: /data/keys
                values: /data/values
              ephemeral: false
              ttl:
                spans: 48h
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      jaeger_storage_exporter:
        trace_storage: training
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: bigdata
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: metrics
    port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: bigdata
spec:
  serviceName: jaeger
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
        ports:
        - containerPort: 16686
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8888
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/jaeger
        args:
        - --config=/etc/jaeger/config.yaml
        readinessProbe:
          httpGet: &id001
            path: /
            port: 16686
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: jaeger-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
