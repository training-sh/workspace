data:
  spark.json: |
    {
      "uid": "training-spark",
      "title": "Spark - master, workers and logs",
      "description": "Native Spark standalone master/worker overview: all four master gauges and five worker gauges, capacity/utilization, pod resources, JVM heap/pools/buffers/GC, daemon/driver/executor logs. Uses the existing PrometheusServlet and cAdvisor; no extra exporter. Per-job SQL/stage/task profiling remains in the Spark application UI.",
      "schemaVersion": 39,
      "version": 5,
      "tags": [
        "training",
        "spark",
        "standalone",
        "jvm"
      ],
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "links": [
        {
          "type": "link",
          "title": "Spark metrics reference",
          "targetBlank": true,
          "url": "https://spark.apache.org/docs/3.5.7/monitoring.html#metrics"
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Master scrape health",
          "type": "stat",
          "description": "1: reachable; 0: scrape failed. Missing data means no target.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(up{job=\"spark-master\"})",
              "legendFormat": "Master scrape health",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
