    {
      "uid": "training-kafka",
      "title": "Kafka - topics, consumers and logs",
      "description": "Adapted from Grafana.com Kafka Exporter Overview 7589 revision 5. Modern panels, fixed lab datasource UIDs, scoped exporter queries, topic/group filters, broker health, resource metrics and Loki logs.",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "training",
        "kafka",
        "template-7589"
      ],
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "links": [
        {
          "title": "Source template 7589",
          "type": "link",
          "targetBlank": true,
          "url": "https://grafana.com/grafana/dashboards/7589-kafka-exporter-overview/"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "topic",
            "label": "Topic",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kafka_topic_partitions{job=\"kafka-exporter\",topic!=\"__consumer_offsets\"}, topic)",
              "refId": "VariableQuery"
            },
            "definition": "label_values(kafka_topic_partitions{job=\"kafka-exporter\",topic!=\"__consumer_offsets\"}, topic)",
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "group",
            "label": "Consumer group",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kafka_consumergroup_lag{job=\"kafka-exporter\"}, consumergroup)",
              "refId": "VariableQuery"
            },
            "definition": "label_values(kafka_consumergroup_lag{job=\"kafka-exporter\"}, consumergroup)",
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
