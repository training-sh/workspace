apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-ui
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-ui-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: workspace-ui
  namespace: headlamp
---
# Pod operations are limited to the workshop namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-ui-pods
  namespace: bigdata
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
- apiGroups: ['']
  resources: [pods/exec, pods/attach, pods/portforward]
  verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-ui-pods
  namespace: bigdata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-ui-pods
subjects:
- kind: ServiceAccount
  name: workspace-ui
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-ui-cluster-read
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - namespaces
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-ui-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-ui-cluster-read
subjects:
- kind: ServiceAccount
  name: workspace-ui
  namespace: headlamp
