apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: bigdata
data:
  server.properties: 'broker.id=BROKER_ID

    zookeeper.connect=zookeeper.bigdata.svc.cluster.local:2181

    listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093

    advertised.listeners=INTERNAL://BROKER_HOST:9092,EXTERNAL://127.0.0.1:EXTERNAL_PORT

    listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

    inter.broker.listener.name=INTERNAL

    log.dirs=/var/lib/kafka/data

    num.partitions=3

    default.replication.factor=1

    offsets.topic.replication.factor=1

    transaction.state.log.replication.factor=1

    transaction.state.log.min.isr=1

    group.initial.rebalance.delay.ms=0

    auto.create.topics.enable=false

    log.retention.hours=168

    log.segment.bytes=1073741824

    zookeeper.connection.timeout.ms=60000

    '
  start.sh: "#!/usr/bin/env bash\nset -euo pipefail\nexport LOG_DIR=${LOG_DIR:-/tmp/kafka-logs}\n\
    ordinal=${HOSTNAME##*-}\nbroker_id=$((ordinal + 1))\nexternal_port=$((19092 +\
    \ ordinal))\nbroker_host=\"${HOSTNAME}.kafka-headless.bigdata.svc.cluster.local\"\
    \nsed -e \"s/BROKER_ID/${broker_id}/g\" -e \"s/BROKER_HOST/${broker_host}/g\"\
    \ -e \"s/EXTERNAL_PORT/${external_port}/g\" \\\n  /etc/kafka-training/server.properties\
    \ > /tmp/server.properties\nexec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties\n"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bigdata
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: metrics
    port: 9404
    targetPort: 9404
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: bigdata
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bigdata
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      annotations:
        training.bigdata/listeners: internal-external-v1
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: wait-for-zookeeper
        image: zookeeper:3.9.3@sha256:9980cafbff742c15b339811ae829faa61c69154606ec504223560da9d31acd43
        command:
        - bash
        - -ec
        args:
        - until (echo ruok > /dev/tcp/zookeeper.bigdata.svc.cluster.local/2181) 2>/dev/null;
          do echo 'Waiting for ZooKeeper and cluster DNS'; sleep 3; done
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: kafka
        image: dataeng-training:1.2.0
        imagePullPolicy: IfNotPresent
        args:
        - kafka
        env:
        - name: LOG_DIR
          value: /tmp/kafka-logs
        - name: KAFKA_HEAP_OPTS
          value: -Xms256m -Xmx512m
        - name: TRAINING_JMX_METRICS
          value: 'true'
        ports:
        - containerPort: 9092
        - containerPort: 9093
        - name: metrics
          containerPort: 9404
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          exec:
            command:
            - /opt/kafka/bin/kafka-broker-api-versions.sh
            - --bootstrap-server
            - localhost:9092
          timeoutSeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: config
          mountPath: /etc/kafka-training
          readOnly: true
        - name: data
          mountPath: /var/lib/kafka/data
        - name: telemetry
          mountPath: /etc/training-telemetry
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: kafka-config
      - name: telemetry
        configMap:
          name: training-telemetry
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
