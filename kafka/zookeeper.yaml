apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: bigdata
spec:
  selector:
    app: zookeeper
  ports:
  - name: client
    port: 2181
    targetPort: 2181
  - name: metrics
    port: 7000
    targetPort: 7000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-data
  namespace: bigdata
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: bigdata
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: zookeeper
        image: zookeeper:3.9.3@sha256:9980cafbff742c15b339811ae829faa61c69154606ec504223560da9d31acd43
        env:
        - name: ZOO_STANDALONE_ENABLED
          value: 'true'
        - name: ZOO_ADMINSERVER_ENABLED
          value: 'false'
        - name: ZOO_4LW_COMMANDS_WHITELIST
          value: ruok,srvr
        - name: JVMFLAGS
          value: -Xms128m -Xmx256m
        - name: ZOO_CFG_EXTRA
          value: 'metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider

            metricsProvider.httpPort=7000

            metricsProvider.exportJvmInfo=true'
        ports:
        - containerPort: 2181
        - name: metrics
          containerPort: 7000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 2181
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - zkServer.sh status
          timeoutSeconds: 10
          periodSeconds: 20
        livenessProbe:
          tcpSocket:
            port: 2181
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: data
        - name: data
          mountPath: /datalog
          subPath: datalog
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zookeeper-data
