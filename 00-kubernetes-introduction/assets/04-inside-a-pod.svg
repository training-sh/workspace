<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A Pod is the unit Kubernetes places on a node</title><desc id="desc">One app container is common. Add a sidecar only when it belongs in the same Pod.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="50" y="47.3" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">KUBERNETES / VISUAL GUIDE</text>
<text x="50" y="92.88" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">A Pod is the unit Kubernetes places on a node</text>
<text x="50" y="131.57999999999998" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">One app container is common. Add a sidecar only when it belongs in the same Pod.</text>
<rect x="50" y="185" width="550" height="435" rx="16" fill="white" stroke="#087f5b" stroke-width="2"/>
<text x="75" y="223.86" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">POD: one scheduling and network unit</text>
<rect x="75" y="270" width="235" height="140" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="93" y="305.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">App container</text>
<text x="93" y="337.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Runs the application</text>
<text x="93" y="365.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reads/writes shared files</text>
<rect x="335" y="270" width="240" height="140" rx="16" fill="#f3effb" stroke="#7047bd" stroke-width="2"/>
<text x="353" y="305.04" fill="#7047bd" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Sidecar</text>
<text x="353" y="337.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Example: forwards logs</text>
<text x="353" y="365.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Has its own resources</text>
<rect x="75" y="445" width="500" height="75" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="93" y="480.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">One Pod IP + shared localhost</text>
<rect x="75" y="550" width="500" height="50" rx="16" fill="#fff6e7" stroke="#ad6200" stroke-width="2"/>
<text x="93" y="584.22" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">A volume can be mounted by both containers</text>
<polyline points="193,410 193,445" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="193.0,445.0 187.9,435.2 198.1,435.2" fill="#526581"/>
<polyline points="455,410 455,445" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="455.0,445.0 449.9,435.2 460.1,435.2" fill="#526581"/>
<rect x="650" y="185" width="500" height="170" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="668" y="220.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">What is shared?</text>
<text x="668" y="253.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Network namespace and Pod IP</text>
<text x="668" y="281.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Declared volumes, when mounted</text>
<text x="668" y="309.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Containers keep separate image filesystems</text>
<rect x="650" y="385" width="500" height="235" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="668" y="420.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">What is not a replica?</text>
<text x="668" y="453.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">App + sidecar = one Pod, not two replicas.</text>
<text x="668" y="481.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Two independent app copies = two Pods.</text>
<text x="668" y="509.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Frontend and database usually use</text>
<text x="668" y="537.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">separate Pods and Services.</text>
<rect x="50" y="659" width="1100" height="42" rx="10" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="2"/>
<text x="70" y="682.94" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A replacement Pod has a new identity and usually a new IP. Put persistent application data on suitable storage.</text>
</svg>
