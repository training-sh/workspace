<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From one container to a managed application</title><desc id="desc">The image can stay the same. The way you manage its running copies changes.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="50" y="47.3" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">KUBERNETES / VISUAL GUIDE</text>
<text x="50" y="92.88" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">From one container to a managed application</text>
<text x="50" y="131.57999999999998" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The image can stay the same. The way you manage its running copies changes.</text>
<rect x="50" y="180" width="350" height="440" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="215.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Docker Engine</text>
<text x="68" y="248.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Package and run containers</text>
<text x="68" y="276.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">on a chosen host.</text>
<rect x="425" y="180" width="350" height="440" rx="16" fill="#f3effb" stroke="#7047bd" stroke-width="2"/>
<text x="443" y="215.04" fill="#7047bd" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Docker Compose</text>
<text x="443" y="248.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Describe a multi-container</text>
<text x="443" y="276.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">application on a Docker host.</text>
<rect x="800" y="180" width="350" height="440" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="818" y="215.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Kubernetes</text>
<text x="818" y="248.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Declare desired state;</text>
<text x="818" y="276.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">controllers keep reconciling it.</text>
