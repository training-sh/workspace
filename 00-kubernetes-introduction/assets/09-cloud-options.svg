<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">The same Kubernetes ideas extend to managed clouds</title><desc id="desc">Providers operate the control plane. You still define workloads, access, networking and data needs.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="50" y="47.3" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">KUBERNETES / VISUAL GUIDE</text>
<text x="50" y="92.88" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">The same Kubernetes ideas extend to managed clouds</text>
<text x="50" y="131.57999999999998" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Providers operate the control plane. You still define workloads, access, networking and data needs.</text>
