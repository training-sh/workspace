<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Our Minikube node runs inside host Docker</title><desc id="desc">One local node combines control-plane and worker roles; its Pod runtime is containerd.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="50" y="47.3" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">KUBERNETES / VISUAL GUIDE</text>
<text x="50" y="92.88" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Our Minikube node runs inside host Docker</text>
<text x="50" y="131.57999999999998" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">One local node combines control-plane and worker roles; its Pod runtime is containerd.</text>
<rect x="50" y="180" width="1100" height="445" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="75" y="214.57999999999998" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">UBUNTU HOST / DOCKER ENGINE</text>
<rect x="75" y="275" width="350" height="155" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="93" y="310.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Host Docker image store</text>
<text x="93" y="342.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">dataeng-training:1.2.0</text>
<text x="93" y="370.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Building here does not automatically</text>
<text x="93" y="398.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">populate the node image store.</text>
<rect x="545" y="255" width="580" height="345" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="565" y="291.22" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">MINIKUBE NODE CONTAINER: bigdata</text>
<rect x="565" y="320" width="245" height="145" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="583" y="355.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Kubernetes</text>
<text x="583" y="387.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Control plane + kubelet</text>
<text x="583" y="415.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Services and Pods</text>
<rect x="835" y="320" width="270" height="145" rx="16" fill="#f3effb" stroke="#7047bd" stroke-width="2"/>
<text x="853" y="355.04" fill="#7047bd" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">containerd store</text>
<text x="853" y="386.94" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Imported application image</text>
<text x="853" y="414.94" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Pod containers run here</text>
<polyline points="425,385 520,385 520,485 970,485 970,465" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="970.0,465.0 975.1,474.8 964.9,474.8" fill="#2563eb"/>
<text x="430" y="358.94" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">image import</text>
<rect x="75" y="495" width="350" height="90" rx="16" fill="#fff6e7" stroke="#ad6200" stroke-width="2"/>
<text x="93" y="530.04" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Host source: ~/workspace</text>
<rect x="565" y="510" width="540" height="65" rx="16" fill="#fff6e7" stroke="#ad6200" stroke-width="2"/>
<text x="583" y="545.04" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Node /course-workspace -&gt; Pod /workspace</text>
<polyline points="425,540 565,540" fill="none" stroke="#ad6200" stroke-width="3" stroke-linejoin="round"/>
<polygon points="565.0,540.0 555.2,545.1 555.2,534.9" fill="#ad6200"/>
<rect x="50" y="659" width="1100" height="42" rx="10" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="2"/>
<text x="70" y="682.94" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Deleting this profile removes node/PVC data. Host source files and the retained host Docker image remain separate.</text>
</svg>
