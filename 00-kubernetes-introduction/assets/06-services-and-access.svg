<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">A Service gives changing Pods a stable address</title><desc id="desc">Selectors choose the Pods. Readiness determines which endpoints receive ordinary traffic.</desc>
