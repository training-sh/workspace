<rect x="460" y="385" width="280" height="95" rx="16" fill="#fff6e7" stroke="#ad6200" stroke-width="2"/>
<text x="478" y="420.04" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Pod B: lost</text>
<rect x="870" y="385" width="280" height="95" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
