<text x="70" y="682.94" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Container restart and Pod replacement differ. Recovery still needs healthy capacity, networking and accessible data.</text>
