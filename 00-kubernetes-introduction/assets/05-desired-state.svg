<polyline points="610,385 610,320" fill="none" stroke="#7047bd" stroke-width="3" stroke-linejoin="round"/>
<polygon points="610.0,320.0 615.1,329.8 604.9,329.8" fill="#7047bd"/>
<rect x="460" y="530" width="300" height="90" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="478" y="565.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">New Pod B2: ready</text>
<polyline points="460,285 405,285 405,575 460,575" fill="none" stroke="#087f5b" stroke-width="3" stroke-linejoin="round"/>
