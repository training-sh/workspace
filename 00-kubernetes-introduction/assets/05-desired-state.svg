<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Desired state is a continuing instruction</title><desc id="desc">Example: keep three application Pods available, even as individual Pods disappear.</desc>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="50" y="47.3" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">KUBERNETES / VISUAL GUIDE</text>
<text x="50" y="92.88" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Desired state is a continuing instruction</text>
<text x="50" y="131.57999999999998" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Example: keep three application Pods available, even as individual Pods disappear.</text>
<rect x="50" y="185" width="300" height="135" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="220.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Deployment spec</text>
<text x="68" y="252.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">replicas: 3</text>
<text x="68" y="280.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Image + Pod template</text>
<rect x="460" y="185" width="300" height="135" rx="16" fill="#f3effb" stroke="#7047bd" stroke-width="2"/>
<text x="478" y="220.04" fill="#7047bd" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Controller + ReplicaSet</text>
<text x="478" y="252.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Compare spec with current state</text>
<text x="478" y="280.76" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Create replacement Pods</text>
