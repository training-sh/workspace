<rect x="870" y="420" width="280" height="165" rx="16" fill="#e9f7f0" stroke="#087f5b" stroke-width="2"/>
<text x="888" y="455.04" fill="#087f5b" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Pod</text>
<text x="888" y="488.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Running container(s)</text>
<text x="888" y="516.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Using the selected image</text>
<polyline points="320,500 460,500" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="460.0,500.0 450.2,505.1 450.2,494.9" fill="#526581"/>
<polyline points="730,500 870,500" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="870.0,500.0 860.2,505.1 860.2,494.9" fill="#526581"/>
<polyline points="1010,335 1010,380 600,380 600,420" fill="none" stroke="#ad6200" stroke-width="3" stroke-linejoin="round"/>
<polygon points="600.0,420.0 594.9,410.2 605.1,410.2" fill="#ad6200"/>
<text x="750" y="368.76" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">pull image</text>
<rect x="50" y="659" width="1100" height="42" rx="10" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="2"/>
<text x="70" y="682.94" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A tag is a label that can move. A digest identifies exact image content. A container is a runtime instance.</text>
