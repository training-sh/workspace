<text x="478" y="220.04" fill="#7047bd" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Image</text>
<text x="478" y="253.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Layers + configuration</text>
<text x="478" y="281.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Tag or immutable digest</text>
<rect x="870" y="185" width="280" height="150" rx="16" fill="#fff6e7" stroke="#ad6200" stroke-width="2"/>
<text x="888" y="220.04" fill="#ad6200" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Registry</text>
<text x="888" y="253.57999999999998" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Store and distribute images</text>
<text x="888" y="281.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Private or public</text>
<polyline points="320,260 460,260" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="460.0,260.0 450.2,265.1 450.2,254.9" fill="#526581"/>
<polyline points="730,260 870,260" fill="none" stroke="#526581" stroke-width="3" stroke-linejoin="round"/>
<polygon points="870.0,260.0 860.2,265.1 860.2,254.9" fill="#526581"/>
<text x="360" y="239.76" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">build</text>
<text x="772" y="239.76" fill="#526581" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">push</text>
<rect x="50" y="420" width="270" height="165" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/>
<text x="68" y="455.04" fill="#2563eb" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Kubelet</text>
<text x="68" y="488.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Reads assigned Pod spec</text>
<text x="68" y="516.58" fill="#172b4d" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Calls the runtime via CRI</text>
